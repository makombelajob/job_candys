name: Deploy via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment files
        run: |
          echo "Checking Symfony templates..."
          test -f app/templates/bundles/TwigBundle/Exception/error.html.twig
          ls -la app/templates/bundles/TwigBundle/Exception/

      - name: Deploy files via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          source: ".,!.git,!.github,!.idea,!.env,!.env.*,!mysql/**,!node_modules/**"
          target: "/var/www/online-webs/job-candys.jobmakombela.fr/"
          overwrite: true
          strip_components: 0
          debug: true