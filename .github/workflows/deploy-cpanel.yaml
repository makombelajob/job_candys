name: Test Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check dist
        run: |
          echo "=== Workspace ==="
          pwd
          echo "=== dist ==="
          ls -la dist/

      - name: Deploy to Staging
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

          REMOTE_HOST: ${{ secrets.FTP_HOST }}
          REMOTE_USER: ${{ secrets.FTP_USER }}
          REMOTE_PORT: 22

          SOURCE: "dist/"
          TARGET: ${{ secrets.FTP_TARGET }}

          ARGS: "-rlgoDzvc -i"

          EXCLUDE: "/node_modules/"

          SCRIPT_BEFORE: |
            echo "===== BEFORE ====="
            whoami
            hostname
            echo "Target:"
            ls -la "${{ secrets.FTP_TARGET }}"

          SCRIPT_AFTER: |
            echo "===== AFTER ====="
            whoami
            hostname
            echo "Target:"
            ls -la "${{ secrets.FTP_TARGET }}"
            echo "RSYNC:"
            echo "$RSYNC_STDOUT"

