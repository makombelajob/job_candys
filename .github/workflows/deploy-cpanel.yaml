name: Test SSH Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SSH Deploy Test
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.FTP_HOST }}
          REMOTE_USER: ${{ secrets.FTP_USER }}
          REMOTE_PORT: 22
          SOURCE: "dist/"
          TARGET: ${{ secrets.FTP_TARGET }}
          ARGS: "-rlgoDzvc -i"
          SCRIPT_BEFORE: |
            echo "=== SSH OK ==="
            whoami
            hostname
            pwd
            ls -la
            ls -la /var/www/online-webs/job-candys.jobmakombela.fr/
